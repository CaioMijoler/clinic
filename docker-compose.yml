version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: clinic-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: mysql@102030
      MYSQL_DATABASE: clinical
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: clinic-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
